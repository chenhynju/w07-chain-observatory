services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: w07
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: w07
    volumes:
      - w07_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U w07 -d w07"]
      interval: 5s
      timeout: 5s
      retries: 20

  indexer:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://w07:${POSTGRES_PASSWORD}@postgres:5432/w07
    ports:
      - "127.0.0.1:42069:42069"

volumes:
  w07_pgdata:
